name: CI

# Valida manifest, sintaxis JS, referencias y tests en cada push y pull request
# (el mismo scripts/check.sh que el hook de pre-commit y la release).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validar (manifest, sintaxis JS, referencias y tests)
        run: bash scripts/check.sh

      - name: Contraste de los temas del correo (WCAG AA, editor y modo quirks)
        run: bash scripts/a11y-themes.sh
